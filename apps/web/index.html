<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#f3f0e8" />
    <meta name="description" content="Defy the Monarch, a few minutes a day." />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <link rel="manifest" href="./manifest.webmanifest" />
    <link rel="icon" type="image/svg+xml" href="./icon.svg" />
    <link rel="icon" type="image/png" sizes="32x32" href="./favicon-32.png" />
    <link rel="apple-touch-icon" href="./apple-touch-icon.png" />
    <title>Vault Duel</title>
    <style>
      /* splash: the wax seal on paper until the app mounts and replaces #root's content */
      html,
      body {
        background: #f3f0e8;
      }
      .splash {
        position: fixed;
        inset: 0;
        display: grid;
        place-items: center;
      }
      .splash img {
        width: 112px;
        height: 112px;
      }
    </style>
  </head>
  <body>
    <div id="root"><div class="splash"><img src="./icon.svg" alt="Vault Duel" width="112" height="112" /></div></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
