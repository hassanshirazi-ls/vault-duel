    <style>
      /* splash: the wax seal on paper until the app mounts and replaces #root's content */
      html,
      body {
        background: #f3f0e8;
      }
      .splash {
        position: fixed;
        inset: 0;
        display: grid;
        place-items: center;
      }
      .splash img {
        width: 112px;
        height: 112px;
      }
    </style>
